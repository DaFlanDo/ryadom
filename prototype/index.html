<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Екатерина Морозова — психолог</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { sans: ['Inter','sans-serif'], serif: ['Cormorant Garamond','serif'] },
                colors: { bg:'#EEF2E8', ink:'#1F2A1C', sub:'#6B7A60', moss:'#5A6E4B', mossd:'#475838', sage:'#9DAE8E', soft:'#E2EAD7', card:'#FFFFFF', deep:'#141B12' }
            } }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display:none; }
        .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
        details>summary { list-style:none; } details>summary::-webkit-details-marker { display:none; }
        @keyframes pop { from{transform:scale(.96);opacity:0} to{transform:scale(1);opacity:1} }
        .pop { animation: pop .18s ease-out; }
    </style>
</head>
<body class="bg-bg text-ink font-sans antialiased selection:bg-moss/20">

    <main class="max-w-[440px] mx-auto bg-bg relative min-h-screen pb-16 sm:my-6 sm:rounded-[2.2rem] sm:overflow-hidden sm:shadow-[0_30px_80px_-20px_rgba(31,42,28,0.35)]">
        <!-- шапка профиля (рендерится из PROFILE.header) -->
        <header id="profile" class="relative"></header>
        <!-- актуальные (из PROFILE.highlights) -->
        <div id="highlights" class="flex gap-4 overflow-x-auto no-scrollbar px-5 py-6"></div>
        <!-- лента блоков (из PROFILE.blocks) -->
        <div id="feed" class="px-4 space-y-3.5"></div>
        <p class="text-center text-[12px] text-sage/80 mt-8">Профиль на ProHelp</p>
    </main>

    <!-- сторис-просмотрщик -->
    <div id="story" class="fixed inset-0 z-[100] bg-deep hidden items-center justify-center">
        <div class="relative w-full max-w-[440px] h-full sm:h-[92vh] sm:rounded-2xl overflow-hidden mx-auto">
            <img id="storyImg" src="" class="absolute inset-0 w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-b from-deep/60 via-transparent to-deep/80"></div>
            <div id="storyBars" class="absolute top-3 left-3 right-3 flex gap-1.5 z-20"></div>
            <div class="absolute top-7 left-4 right-4 flex items-center justify-between z-20 text-white">
                <div class="flex items-center gap-2">
                    <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=80&q=60" class="w-8 h-8 rounded-full object-cover ring-2 ring-white/30">
                    <span id="storyTitle" class="text-[14px] font-semibold drop-shadow"></span>
                </div>
                <button onclick="closeStory()" class="text-white/90 text-2xl leading-none px-2">✕</button>
            </div>
            <p id="storyText" class="absolute bottom-10 left-5 right-5 text-white text-[18px] font-medium leading-snug drop-shadow z-20"></p>
            <button onclick="prevStory()" class="absolute left-0 top-0 h-full w-1/3 z-10"></button>
            <button onclick="nextStory()" class="absolute right-0 top-0 h-full w-2/3 z-10"></button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="render.js"></script>
</body>
</html>
